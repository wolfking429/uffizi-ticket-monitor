[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uffizi-ticket-monitor"
version = "0.1.0"
description = "A generic GitHub Actions monitor for museum ticket availability"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.62.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[project.scripts]
uffizi-ticket-monitor = "uffizi_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

